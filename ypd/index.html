<html lang="en">
<head>

  <title>Your Productive Day</title>
  <meta name="description" content="Your Productive Day">

  <meta name="viewport" content="width=device-width, initial-scale=1">

<style>

/* Base Styles
–––––––––––––––––––––––––––––––––––––––––––––––––– */
/* NOTE
html is set to 62.5% so that all the REM measurements throughout Skeleton
are based on 10px sizing. So basically 1.5rem = 15px :) */

  font-size: 62.5%; }
body {
  font-size: 1.5em; /* currently ems cause chrome bug misinterpreting rems on body element */

/* Typography

h1, h2, h3, h4, h5, h6 {

/* Larger than phablet */

  h1 { font-size: 5.0rem; }
  h2 { font-size: 4.2rem; }
  h3 { font-size: 3.6rem; }
  h4 { font-size: 3.0rem; }
  h5 { font-size: 2.4rem; }
  h6 { font-size: 1.5rem; }
}

p {
  margin-top: 0; }

/* time icon from https://twitter.com/craigbuckler https://www.sitepoint.com/create-calendar-icon-html5-css3/ */

time.icon
{
  font-size: 1em; /* change icon size */
  display: block;
  position: relative;
  width: 7em;
  height: 7em;
  background-color: #fff;
  margin: 2em auto;
  border-radius: 0.6em;
  box-shadow: 0 1px 0 #bdbdbd, 0 2px 0 #fff, 0 3px 0 #bdbdbd, 0 4px 0 #fff, 0 5px 0 #bdbdbd, 0 0 0 1px #bdbdbd;
  overflow: hidden;
  -webkit-backface-visibility: hidden;
  -webkit-transform: rotate(0deg) skewY(0deg);
  -webkit-transform-origin: 50% 10%;
  transform-origin: 50% 10%;
}

time.icon *
{
  display: block;
  width: 100%;
  font-size: 1em;
  font-weight: bold;
  font-style: normal;
  text-align: center;
}

time.icon strong
{
  position: absolute;
  top: 0;
  padding: 0.4em 0;
  color: #fff;
  background-color: #0099cc;
  border-bottom: 1px dashed #f37302;
  box-shadow: 0 2px 0 #0099cc;
}

time.icon em
{
  position: absolute;
  bottom: 0.3em;
  color: #0099cc;
}

time.icon span
{
  width: 100%;
  font-size: 2.6em;
  letter-spacing: -0.05em;
  padding-top: 0.8em;
  color: #2f2f2f;
}

time.icon:hover, time.icon:focus
{
  -webkit-animation: swing 0.6s ease-out;
  animation: swing 0.6s ease-out;
}
  
  
/*! css to center text */
html, body {
    height: 100%;
}
.parent {
    width: 100%;
    height: 100%;
    display: table;
    text-align: center;
}
.parent > .child {
    display: table-cell;
    vertical-align: middle;
}



</style>

</head>

<body text="#FFF">
<!-- the icon as a time element -->

<section class="parent">
    <div class="child">
	
  <script>
	var now = new Date();
	  var hour = now.getHours();
	  var day = now.getDay();
	  var date = now.getDate();
	  var month = now.getMonth();
	  var minutes = now.getMinutes();
	  
	  

	  var hourly = "#000000,#000001,#000002,#000003,#000004,#003366,#004080,#004d99,#0059b3,#bf80ff,#0073e6,#0080ff,#8000ff,#3399ff,#53c653,#400080,#39ac39,#339933,#000018,#267326,#206020,#000021,#000022,#000023,#000000".split(",")
		
		var weekday ="Sunday,Monday,Tuesday,Wednesday,Thursday,Friday,Saturday,Sunday".split(",")
		
		var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

		/* Change the background every hour to what is set in the hourly variable*/
	  document.body.style.background = hourly[hour];
	  document.write('<time class="icon"><em>'+weekday[day]+'</em><strong>'+monthNames[month]+'</strong><span>'+date+'</span></time>');
	  
/*Everyday after 8 and before 15:00*/
if(hour > 8 && hour < 15) {
document.write('<H1><i class="em em-chart_with_upwards_trend"></i> Make it a productive '+weekday[day]+'</H1><br /><br />');
}

/*Everyday after 14:00 and before 18:00*/
if(hour > 14 && hour < 18) {
document.write('<H1><i class="em em-coffee"></i> Make it a productive day</H1><br /><br />');
}

/*Everyday at 16:00*/
if(hour === 16) {
document.write('<H2><i class="em em-clock4"></i>Do your end of day tasks...Capture, Clarify, Organize.</H2> <br /><H3>Have you captured any meeting notes and tasks?</H3>');
}

/*Everyday after 18:00 and before 23:00*/
if(hour > 18 && hour < 23) {
document.write('<H1>Good evening</H1><br />');
}

/*Everyday at 9:00, 12:00, 15:00, 18:00 and 21:00*/
if( (hour > 5 && hour < 10) || hour == 12 || hour == 15 || hour == 18 || hour == 21) {
document.write('<H2><i class="em em-ballot_box_with_check"></i> Check your todo list</H2><br />');
}

/*Everyday after 22:00*/
if(hour > 22 || hour < 5) {
document.write('<H1><i class="em em-sleeping_accommodation"></i>Get some sleep</H1>');
}

/*Friday after 16:00*/
if(day == 5 && hour > 16 && hour < 23) {
document.write('<H2>Have you done your weekly review?</h2><br />');
}

/*Saturdays after 8:00 and before 18:00*/	  
if (day == 6 && hour > 8 && hour < 18){
document.write('<H1>Saturdays are the best days</H1><br />');
}


  </script>	
	
	</div>
</section>

</body>
</html>
